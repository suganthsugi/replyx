name: Release

# Builds and pushes the two deployable images (research D24) on every push to
# main: replyx-api (apps/api/Dockerfile, target `runtime`) and replyx-web
# (infra/caddy/Dockerfile, the Caddy image built in T010). Each is tagged with
# both the commit sha and `main`, so the VM's Compose file can pin a sha and
# `:main` always resolves to the latest build.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/replyx-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/replyx-api:main
          cache-from: type=gha,scope=replyx-api
          cache-to: type=gha,mode=max,scope=replyx-api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/replyx-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/replyx-web:main
          cache-from: type=gha,scope=replyx-web
          cache-to: type=gha,mode=max,scope=replyx-web
