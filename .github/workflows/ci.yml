name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Placeholder until the monorepo is scaffolded: turbo tasks run once turbo.json exists.
      - name: Lint
        run: |
          if [ -f turbo.json ]; then pnpm turbo run lint; else pnpm lint; fi

      - name: Typecheck
        run: |
          if [ -f turbo.json ]; then pnpm turbo run typecheck; else echo "typecheck: no turbo.json yet — skipping"; fi

      - name: Test
        run: |
          if [ -f turbo.json ]; then pnpm turbo run test; else echo "test: no turbo.json yet — skipping"; fi

      - name: Coverage gate (api >= 80%, web >= 70%)
        run: bash scripts/check-coverage.sh

      - name: Generated API client is up to date
        run: |
          bash scripts/generate-api-client.sh
          if [ -n "$(git status --porcelain -- apps/web/src/api/generated)" ]; then
            git status --porcelain -- apps/web/src/api/generated
            echo "Run scripts/generate-api-client.sh and commit the result"
            exit 1
          fi

      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint apps/api/openapi.yaml

  # The docs site (apps/docs): a static export, checked the way production serves it.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter docs...

      - name: Typecheck
        run: pnpm --filter docs typecheck

      - name: Unit tests
        run: pnpm --filter docs test

      - name: Build the static export
        run: pnpm --filter docs build

      - name: Check internal links
        run: pnpm --filter docs check:links

      - name: Install Chromium for Playwright
        run: pnpm --filter docs exec playwright install --with-deps chromium

      # Serves apps/docs/out (playwright.config.ts webServer) and runs desktop and 360 px projects.
      - name: End-to-end tests
        run: pnpm --filter docs test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
            target: runtime
          - image: web
            file: apps/web/Dockerfile
            target: build
          - image: caddy
            file: infra/caddy/Dockerfile
            target: ""
          - image: docs
            file: apps/docs/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
