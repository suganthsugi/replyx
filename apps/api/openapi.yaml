# Single source of truth for the ReplyX HTTP API (constitution IX). The web client is generated
# from this file (scripts/generate-api-client.sh, orval tags-split).
#
# Merging rules (specs/001-multi-tenant-helpdesk/contracts/README.md):
# - Every operation gets a camelCase operationId (listTickets, triageTicket). orval names the
#   generated hooks after it.
# - Every operation gets exactly one tag from the list below. orval splits the client by tag.
# - Explicit request/response schemas only. Storage models are never exposed.
# - Errors always use ErrorResponse via the shared responses below.
openapi: 3.1.0
info:
  title: ReplyX API
  version: 0.1.0
  description: >
    Staff and customer API of the ReplyX multi-tenant helpdesk. The tenant always comes from the
    host. Authentication uses the `rx_session` cookie, and state-changing requests must send an
    `X-CSRF-Token` header matching the `rx_csrf` cookie. Lists are cursor-paginated and wrapped as
    `{ "items": [...], "nextCursor": "..." | null }`. Creating POSTs accept an optional
    `Idempotency-Key` header (kept 24 h).
servers:
  - url: https://{tenant}.replyx.app/api/v1
    description: Tenant host
    variables:
      tenant:
        default: acme
        description: Tenant slug (subdomain)
security:
  - session: []
tags:
  - name: identity
    description: Sign-in, sessions, own profile, users and invitations
  - name: access
    description: Roles, permissions and groups
  - name: tickets
    description: Tickets, messages, views, tags, macros, customers, attachments and search
  - name: operations
    description: >
      Notifications, dashboard, audit logs, settings, support access, SLA policies, business hours,
      routing rules, automation rules and webhooks
  - name: customer
    description: Customer-facing conversation API under /customer
paths:
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags:
        - identity
      summary: Request a password reset email (same response whether or not the email exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Accepted
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - identity
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "204":
          description: Password changed; all other sessions ended
        "400":
          $ref: "#/components/responses/ValidationFailed"
  /auth/sign-in:
    post:
      operationId: signIn
      tags:
        - identity
      summary: Staff sign-in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Signed in; sets rx_session and rx_csrf cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Wrong email or password (same response for unknown email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: TENANT_SUSPENDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-out:
    post:
      operationId: signOut
      tags:
        - identity
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /auth/sign-out-all:
    post:
      operationId: signOutAll
      tags:
        - identity
      summary: End every session of the current user (FR-011)
      responses:
        "204":
          description: All sessions ended; open sockets disconnect
  /customer/auth/sign-in:
    post:
      operationId: customerSignIn
      tags:
        - customer
      summary: Password sign-in for customers who set a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                trustDevice:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-in-link:
    post:
      operationId: requestSignInLink
      tags:
        - customer
      summary: Email a one-time sign-in link (FR-012); same response whether or not the account exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                  description: Used only when self-registration creates the account
      responses:
        "202":
          description: If allowed, a link was sent
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: TENANT_SUSPENDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-in-link/redeem:
    post:
      operationId: redeemSignInLink
      tags:
        - customer
      summary: Redeem a sign-in link token (single use, 15-minute expiry)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                trustDevice:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Signed in; sets cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "400":
          description: LINK_INVALID_OR_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-out:
    post:
      operationId: customerSignOut
      tags:
        - customer
      summary: Sign out this device
      responses:
        "204":
          description: Signed out
  /customer/auth/sign-out-all:
    post:
      operationId: customerSignOutAll
      tags:
        - customer
      summary: Sign out everywhere
      responses:
        "204":
          description: Signed out everywhere
  /customer/me:
    get:
      operationId: getCustomerMe
      tags:
        - customer
      summary: Current customer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateCustomerMe
      tags:
        - customer
      summary: Update name, avatar, password, notification preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 120
                avatarAttachmentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
                currentPassword:
                  type: string
                  description: Required when a password is already set
                emailOnReply:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags:
        - identity
      summary: Inspect an invitation before accepting
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                type: object
                required:
                  - email
                  - tenantName
                properties:
                  email:
                    type: string
                    format: email
                  tenantName:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags:
        - identity
      summary: Accept an invitation and set a password
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "200":
          description: Account active; signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Current user, effective permissions and group access
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Update own profile (FR-013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                avatarAttachmentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                availability:
                  $ref: "#/components/schemas/Availability"
                timeDisplay:
                  type: object
                  properties:
                    timezone:
                      type: string
                    hour12:
                      type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /me/password:
    put:
      operationId: changePassword
      tags:
        - identity
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "204":
          description: Changed; other sessions ended
        "400":
          $ref: "#/components/responses/ValidationFailed"
  /users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: List users (user.view)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - staff
              - customer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Name or email contains
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: inviteUser
      tags:
        - identity
      summary: Invite a user (user.create) — staff with roles, or a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - roleIds
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                roleIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: EMAIL_IN_USE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    get:
      operationId: getUser
      tags:
        - identity
      summary: Get a user (user.view)
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags:
        - identity
      summary: Edit a user's name or roles (user.edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 120
                roleIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated; access change takes effect immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags:
        - identity
      summary: Hard-delete a user with no history (user.delete)
      responses:
        "204":
          description: Deleted
        "409":
          description: USER_HAS_HISTORY — deactivate or erase instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    parameters:
      - $ref: "#/components/parameters/IdPath"
  /users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags:
        - identity
      summary: Deactivate (user.edit) — blocks sign-in, ends sessions, unassigns tickets
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}/erase:
    post:
      operationId: eraseUser
      tags:
        - identity
      summary: Data erasure (user.erase) — see spec Assumptions for what is removed
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirm
              properties:
                confirm:
                  type: string
                  const: ERASE
      responses:
        "202":
          description: Erasure scheduled; audit entry written
  /users/{id}/reactivate:
    post:
      operationId: reactivateUser
      tags:
        - identity
      summary: Reactivate (user.edit)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rx_session
      description: Session cookie set on sign-in
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's nextCursor
      schema: {type: string}
    IdPath:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key that makes a creating POST safe to retry (kept 24 h)
      schema: {type: string, maxLength: 100}
  responses:
    ValidationFailed:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PermissionDenied:
      description: Resource is visible but the action is not allowed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Missing, belongs to another tenant, or not visible to the caller
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]+$'
              examples: [TICKET_NOT_FOUND]
            message: {type: string}
            details:
              type: array
              description: Only present for validation errors
              items:
                type: object
                required: [path, issue]
                properties:
                  path: {type: string}
                  issue: {type: string}
            retryAfter: {type: integer, description: 'Seconds, only for RATE_LIMITED'}
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: {type: [string, 'null']}
    TicketState:
      type: string
      enum: [new, open, pending_reminder, pending_close, resolved, closed]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    WaitingOn:
      type: string
      enum: [support, customer]
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    Availability:
      type: string
      enum: [online, away, offline]
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        avatarUrl: {type: [string, 'null'], format: uri}
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
    TagRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
    AttachmentSummary:
      type: object
      required: [id, fileName, contentType, sizeBytes, scanStatus]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer}
        scanStatus: {type: string, enum: [pending, clean, blocked]}
        downloadPath:
          type: [string, 'null']
          description: API path that authorizes and redirects to a short-lived URL; null unless clean
    ConditionExpression:
      description: View / rule condition tree (see data-model.md "Condition expression")
      oneOf:
        - $ref: '#/components/schemas/ConditionGroup'
        - $ref: '#/components/schemas/Condition'
    ConditionGroup:
      type: object
      required: [op, items]
      additionalProperties: false
      properties:
        op: {type: string, enum: [and, or]}
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ConditionExpression'}
    Condition:
      type: object
      required: [field, operator, value]
      additionalProperties: false
      properties:
        field:
          type: string
          enum:
            - state
            - priority
            - group
            - owner
            - customer
            - tags
            - waiting_on
            - created_at
            - updated_at
            - last_customer_message_at
            - sla_status
        operator:
          type: string
          enum: [is, is_not, contains, before, after, within_last]
        value: {}
    Me:
      type: object
      required:
        - id
        - email
        - name
        - kind
        - roles
        - permissions
        - groupAccess
        - accessVersion
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - staff
            - customer
        availability:
          $ref: "#/components/schemas/Availability"
        roles:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
        permissions:
          type: array
          items:
            type: string
          examples:
            - - ticket.view
              - ticket.edit
        groupAccess:
          type: array
          description: Effective (union) access; groupId null = Ungrouped
          items:
            type: object
            required:
              - groupId
              - view
              - create
              - edit
              - delete
            properties:
              groupId:
                type:
                  - string
                  - "null"
                format: uuid
              view:
                type: boolean
              create:
                type: boolean
              edit:
                type: boolean
              delete:
                type: boolean
        accessVersion:
          type: integer
          description: Changes whenever access changes; clients refetch /me when it moves
    User:
      type: object
      required:
        - id
        - email
        - name
        - kind
        - status
        - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        kind:
          type: string
          enum:
            - staff
            - customer
        status:
          $ref: "#/components/schemas/UserStatus"
        locked:
          type: boolean
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        availability:
          $ref: "#/components/schemas/Availability"
        lastSignInAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
    CustomerMe:
      type: object
      required:
        - id
        - name
        - email
        - hasPassword
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type:
            - string
            - "null"
        hasPassword:
          type: boolean
        emailOnReply:
          type: boolean
