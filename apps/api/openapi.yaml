# Single source of truth for the ReplyX HTTP API (constitution IX). The web client is generated
# from this file (scripts/generate-api-client.sh, orval tags-split).
#
# Merging rules (specs/001-multi-tenant-helpdesk/contracts/README.md):
# - Every operation gets a camelCase operationId (listTickets, triageTicket). orval names the
#   generated hooks after it.
# - Every operation gets exactly one tag from the list below. orval splits the client by tag.
# - Explicit request/response schemas only. Storage models are never exposed.
# - Errors always use ErrorResponse via the shared responses below.
openapi: 3.1.0
info:
  title: ReplyX API
  version: 0.1.0
  description: >
    Staff and customer API of the ReplyX multi-tenant helpdesk. The tenant always comes from
    the host. Authentication uses the `rx_session` cookie, and state-changing requests must send
    an `X-CSRF-Token` header matching the `rx_csrf` cookie. Lists are cursor-paginated and
    wrapped as `{ "items": [...], "nextCursor": "..." | null }`. Creating POSTs accept an
    optional `Idempotency-Key` header (kept 24 h).
servers:
  - url: https://{tenant}.replyx.app/api/v1
    description: Tenant host
    variables:
      tenant:
        default: acme
        description: Tenant slug (subdomain)
security:
  - session: []
tags:
  - name: identity
    description: Sign-in, sessions, own profile, users and invitations
  - name: access
    description: Roles, permissions and groups
  - name: tickets
    description: Tickets, messages, views, tags, macros, customers, attachments and search
  - name: operations
    description: >
      Notifications, dashboard, audit logs, settings, support access, SLA policies, business
      hours, routing rules, automation rules and webhooks
  - name: customer
    description: Customer-facing conversation API under /customer
paths: {}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rx_session
      description: Session cookie set on sign-in
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's nextCursor
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key that makes a creating POST safe to retry (kept 24 h)
      schema: { type: string, maxLength: 100 }
  responses:
    ValidationFailed:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PermissionDenied:
      description: Resource is visible but the action is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Missing, belongs to another tenant, or not visible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]+$'
              examples: [TICKET_NOT_FOUND]
            message: { type: string }
            details:
              type: array
              description: Only present for validation errors
              items:
                type: object
                required: [path, issue]
                properties:
                  path: { type: string }
                  issue: { type: string }
            retryAfter: { type: integer, description: 'Seconds, only for RATE_LIMITED' }
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }
    TicketState:
      type: string
      enum: [new, open, pending_reminder, pending_close, resolved, closed]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    WaitingOn:
      type: string
      enum: [support, customer]
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    Availability:
      type: string
      enum: [online, away, offline]
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    TagRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    AttachmentSummary:
      type: object
      required: [id, fileName, contentType, sizeBytes, scanStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        scanStatus: { type: string, enum: [pending, clean, blocked] }
        downloadPath:
          type: [string, 'null']
          description: API path that authorizes and redirects to a short-lived URL; null unless clean
    ConditionExpression:
      description: View / rule condition tree (see data-model.md "Condition expression")
      oneOf:
        - $ref: '#/components/schemas/ConditionGroup'
        - $ref: '#/components/schemas/Condition'
    ConditionGroup:
      type: object
      required: [op, items]
      additionalProperties: false
      properties:
        op: { type: string, enum: [and, or] }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ConditionExpression' }
    Condition:
      type: object
      required: [field, operator, value]
      additionalProperties: false
      properties:
        field:
          type: string
          enum:
            - state
            - priority
            - group
            - owner
            - customer
            - tags
            - waiting_on
            - created_at
            - updated_at
            - last_customer_message_at
            - sla_status
        operator:
          type: string
          enum: [is, is_not, contains, before, after, within_last]
        value: {}
