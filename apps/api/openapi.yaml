openapi: 3.1.0
info:
  title: ReplyX API
  version: 0.1.0
  description: >
    Staff and customer API of the ReplyX multi-tenant helpdesk. The tenant always comes from the host. Authentication
    uses the `rx_session` cookie, and state-changing requests must send an `X-CSRF-Token` header matching the `rx_csrf`
    cookie. Lists are cursor-paginated and wrapped as `{ "items": [...], "nextCursor": "..." | null }`. Creating POSTs
    accept an optional `Idempotency-Key` header (kept 24 h).
servers:
  - url: https://{tenant}.replyx.app/api/v1
    description: Tenant host
    variables:
      tenant:
        default: acme
        description: Tenant slug (subdomain)
  - url: https://console.replyx.app/api/v1
    description: Console host (platform operators)
security:
  - session: []
tags:
  - name: identity
    description: Sign-in, sessions, own profile, users and invitations
  - name: access
    description: Roles, permissions and groups
  - name: tickets
    description: Tickets, messages, views, tags, macros, customers, attachments and search
  - name: operations
    description: >
      Notifications, dashboard, audit logs, settings, support access, SLA policies, business hours, routing rules,
      automation rules and webhooks
  - name: customer
    description: Customer-facing conversation API under /customer
  - name: platform
    description: Platform console API on the console host; operators belong to no tenant
paths:
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags:
        - identity
      summary: Request a password reset email (same response whether or not the email exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Accepted
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - identity
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "204":
          description: Password changed; all other sessions ended
        "400":
          $ref: "#/components/responses/ValidationFailed"
  /auth/sign-in:
    post:
      operationId: signIn
      tags:
        - identity
      summary: Staff sign-in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Signed in; sets rx_session and rx_csrf cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Wrong email or password (same response for unknown email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: TENANT_SUSPENDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-out:
    post:
      operationId: signOut
      tags:
        - identity
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /auth/sign-out-all:
    post:
      operationId: signOutAll
      tags:
        - identity
      summary: End every session of the current user (FR-011)
      responses:
        "204":
          description: All sessions ended; open sockets disconnect
  /customer/auth/sign-in:
    post:
      operationId: customerSignIn
      tags:
        - customer
      summary: Password sign-in for customers who set a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                trustDevice:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-in-link:
    post:
      operationId: requestSignInLink
      tags:
        - customer
      summary: Email a one-time sign-in link (FR-012); same response whether or not the account exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                  description: Used only when self-registration creates the account
      responses:
        "202":
          description: If allowed, a link was sent
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: TENANT_SUSPENDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-in-link/redeem:
    post:
      operationId: redeemSignInLink
      tags:
        - customer
      summary: Redeem a sign-in link token (single use, 15-minute expiry)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                trustDevice:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Signed in; sets cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "400":
          description: LINK_INVALID_OR_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/auth/sign-out:
    post:
      operationId: customerSignOut
      tags:
        - customer
      summary: Sign out this device
      responses:
        "204":
          description: Signed out
  /customer/auth/sign-out-all:
    post:
      operationId: customerSignOutAll
      tags:
        - customer
      summary: Sign out everywhere
      responses:
        "204":
          description: Signed out everywhere
  /customer/me:
    get:
      operationId: getCustomerMe
      tags:
        - customer
      summary: Current customer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateCustomerMe
      tags:
        - customer
      summary: Update name, avatar, password, notification preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 120
                avatarAttachmentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
                currentPassword:
                  type: string
                  description: Required when a password is already set
                emailOnReply:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
  /customer/conversation:
    get:
      operationId: getConversation
      tags:
        - customer
      summary: The customer's single thread (all tickets, public content only), newest page first
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: before
          in: query
          description: Cursor for older items (scroll up), from a previous page's olderCursor
          schema:
            type: string
      responses:
        "200":
          description: Thread page
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - status
                  - olderCursor
                  - streamSeq
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreadItem"
                  olderCursor:
                    type:
                      - string
                      - "null"
                  status:
                    $ref: "#/components/schemas/FriendlyStatus"
                  pendingRating:
                    type: "null"
                  streamSeq:
                    type: integer
                    description: Latest seq of the conversation stream, for real-time catch-up
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /customer/messages:
    post:
      operationId: sendCustomerMessage
      tags:
        - customer
      summary: Send a message — routed to exactly one ticket, idempotent by clientMessageId
      description: A repeated clientMessageId returns the message already stored for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
                - clientMessageId
              additionalProperties: false
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                clientMessageId:
                  type: string
                  format: uuid
                attachmentIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Accepted (or the original message when the clientMessageId was already used)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /customer/messages/read:
    post:
      operationId: markConversationRead
      tags:
        - customer
      summary: Mark support replies up to a message as read (drives read receipts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - upToMessageId
              additionalProperties: false
              properties:
                upToMessageId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /customer/attachments:
    post:
      operationId: uploadCustomerAttachment
      tags:
        - customer
      summary: Upload a file for a later message (25 MB max; allowed types only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded; scanStatus pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentSummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          description: ATTACHMENT_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: ATTACHMENT_TYPE_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer/attachments/{id}/download:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: downloadCustomerAttachment
      tags:
        - customer
      summary: Authorize, then redirect to a private URL valid for 15 minutes
      description: Only an attachment on a public message in the customer's own conversation, or the customer's own not-yet-sent upload, is reachable; anything else is 404.
      responses:
        "302":
          description: Redirect to /api/v1/files/{token}, a signed link valid for 15 minutes
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ATTACHMENT_NOT_READY (still scanning) or ATTACHMENT_BLOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags:
        - identity
      summary: Inspect an invitation before accepting
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                type: object
                required:
                  - email
                  - tenantName
                properties:
                  email:
                    type: string
                    format: email
                  tenantName:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags:
        - identity
      summary: Accept an invitation and set a password
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "200":
          description: Account active; signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Current user, effective permissions and group access
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Update own profile (FR-013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                avatarAttachmentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                availability:
                  $ref: "#/components/schemas/Availability"
                timeDisplay:
                  type: object
                  properties:
                    timezone:
                      type: string
                    hour12:
                      type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /me/password:
    put:
      operationId: changePassword
      tags:
        - identity
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 200
      responses:
        "204":
          description: Changed; other sessions ended
        "400":
          $ref: "#/components/responses/ValidationFailed"
  /roles:
    get:
      operationId: listRoles
      tags:
        - access
      summary: List roles (role.view)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createRole
      tags:
        - access
      summary: Create a custom role (role.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          description: ROLE_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: List users (user.view)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - staff
              - customer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Name or email contains
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: inviteUser
      tags:
        - identity
      summary: Invite a user (user.create) — staff with roles, or a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - roleIds
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 120
                roleIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: EMAIL_IN_USE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    get:
      operationId: getUser
      tags:
        - identity
      summary: Get a user (user.view)
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags:
        - identity
      summary: Edit a user's name or roles (user.edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 120
                roleIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated; access change takes effect immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags:
        - identity
      summary: Hard-delete a user with no history (user.delete)
      responses:
        "204":
          description: Deleted
        "409":
          description: USER_HAS_HISTORY — deactivate or erase instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    parameters:
      - $ref: "#/components/parameters/IdPath"
  /users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags:
        - identity
      summary: Deactivate (user.edit) — blocks sign-in, ends sessions, unassigns tickets
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}/erase:
    post:
      operationId: eraseUser
      tags:
        - identity
      summary: Data erasure (user.erase) — see spec Assumptions for what is removed
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirm
              properties:
                confirm:
                  type: string
                  const: ERASE
      responses:
        "202":
          description: Erasure scheduled; audit entry written
  /users/{id}/reactivate:
    post:
      operationId: reactivateUser
      tags:
        - identity
      summary: Reactivate (user.edit)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /platform/auth/sign-in:
    post:
      operationId: operatorSignIn
      tags:
        - platform
      security: []
      summary: Operator sign-in (console host only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "423":
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /platform/auth/sign-out:
    post:
      operationId: operatorSignOut
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Operator sign-out
      responses:
        "204":
          description: Signed out
  /platform/tenants:
    get:
      operationId: listTenants
      tags:
        - platform
      security:
        - operatorSession: []
      summary: List tenants
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
        - name: q
          in: query
          description: Name or slug contains
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Page of tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Create a tenant and invite its first admin (FR-001, FR-006)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
                - adminEmail
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                slug:
                  type: string
                  pattern: ^[a-z0-9](-?[a-z0-9]){2,39}$
                adminEmail:
                  type: string
                  format: email
                timezone:
                  type: string
                  default: UTC
      responses:
        "201":
          description: Created with system roles and an invited admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "409":
          description: SLUG_TAKEN or SLUG_RESERVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /platform/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getTenant
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Tenant details (no business data)
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Rename a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/tenants/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: suspendTenant
      tags:
        - platform
      security:
        - operatorSession: []
      summary: "Suspend: ends sessions, blocks sign-in, pauses webhooks; deletes nothing (FR-004)"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/tenants/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: reactivateTenant
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Reactivate a suspended tenant, with its data untouched
      responses:
        "200":
          description: Active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/tenants/{id}/support-session:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: openSupportSession
      tags:
        - platform
      security:
        - operatorSession: []
      summary: Open a read-only support session under an active grant (FR-001a)
      description: 404 SUPPORT_ACCESS_NOT_GRANTED without an active grant. The token is sent as X-Support-Token on the tenant
        host, expires with the grant, ends immediately on revocation, and every read is audited as support_access.read.
      responses:
        "201":
          description: Support session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /support-access:
    get:
      operationId: listSupportAccessGrants
      tags:
        - operations
      summary: Support-access grants for this tenant (support_access.view)
      responses:
        "200":
          description: Grants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportAccessGrant"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createSupportAccessGrant
      tags:
        - operations
      summary: Grant platform operators temporary read-only access (support_access.create, FR-001a)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationHours
              additionalProperties: false
              properties:
                durationHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessGrant"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /support-access/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: revokeSupportAccessGrant
      tags:
        - operations
      summary: Revoke a grant immediately (support_access.delete)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessGrant"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /customer/branding:
    get:
      operationId: getBranding
      tags:
        - customer
      security: []
      summary: Public chat branding and availability; answers even while the tenant is suspended
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
  /permissions:
    get:
      operationId: listPermissions
      tags:
        - access
      summary: The permission registry, grouped by module (role.view)
      responses:
        "200":
          description: All registered permissions, sorted by module then key
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getRole
      tags:
        - access
      summary: Get a role with its permissions and group-access matrix (role.view)
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRole
      tags:
        - access
      summary: Replace a role's name, permissions and group access (role.edit)
      description: "System roles keep their name (409 SYSTEM_ROLE). Admin: permissions and group access can only grow (400
        ADMIN_ACCESS_FIXED if reduced). Owners who lose edit on a group are unassigned (FR-026). Takes effect
        immediately for connected users."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: VALIDATION_FAILED or ADMIN_ACCESS_FIXED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ROLE_NAME_TAKEN or SYSTEM_ROLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRole
      tags:
        - access
      summary: Delete a custom role (role.delete)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ROLE_IN_USE or SYSTEM_ROLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups:
    get:
      operationId: listGroups
      tags:
        - access
      summary: List groups by name (group.view); Ungrouped is not a group and is not listed
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - inactive
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createGroup
      tags:
        - access
      summary: Create a group (group.create); only Admin gets access (FR-029)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          description: GROUP_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups/destinations:
    get:
      operationId: listGroupDestinations
      tags:
        - access
      summary: Active groups a ticket can be sent to, by name (ticket.edit)
      description: >
        For the triage bar and the ticket's group picker. Ids and names only (no description or
        ticket counts), so it needs ticket.edit rather than group.view. The move itself is still
        checked per group (FR-041).
      responses:
        "200":
          description: Active groups ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupRef"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getGroup
      tags:
        - access
      summary: Get a group (group.view)
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGroup
      tags:
        - access
      summary: Edit name, description or status (group.edit); an empty description clears it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GROUP_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGroup
      tags:
        - access
      summary: Delete a group (group.delete)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "GROUP_HAS_TICKETS: move its tickets to another group or to Ungrouped first (FR-030)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups/{id}/eligible-owners:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listEligibleOwners
      tags:
        - access
      summary: Active staff whose roles grant edit on this group (FR-040, FR-062)
      description: "Needs ticket.edit and edit on the group: a group the caller cannot view is 404, view without edit is 403."
      responses:
        "200":
          description: Eligible owners by name
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EligibleOwner"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets:
    get:
      operationId: listTickets
      tags:
        - tickets
      summary: Tickets visible to the caller, by view or by ad-hoc filter (ticket.view always applied)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: viewId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TicketState"
        - name: priority
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Priority"
        - name: groupId
          in: query
          description: "'ungrouped' for no group"
          schema:
            type: string
        - name: ownerId
          in: query
          description: "'me' or 'unassigned' allowed"
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: number
          in: query
          description: Filters on the ticket's number; a ticket the caller cannot see returns an empty page.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - updated_at
              - -updated_at
              - created_at
              - -created_at
              - priority
              - -priority
              - last_customer_message_at
              - -last_customer_message_at
      responses:
        "200":
          description: Page of tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TicketSummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or invisible viewId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTicket
      tags:
        - tickets
      summary: Start a ticket for an existing customer (FR-038a) — needs create on the group
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - groupId
                - title
                - message
              additionalProperties: false
              properties:
                customerId:
                  type: string
                  format: uuid
                groupId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                message:
                  type: object
                  required:
                    - body
                  additionalProperties: false
                  properties:
                    body:
                      type: string
                      minLength: 1
                      maxLength: 10000
                    attachmentIds:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        format: uuid
                ownerId:
                  type: string
                  format: uuid
                priority:
                  $ref: "#/components/schemas/Priority"
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Created (state open, waiting on customer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CUSTOMER_INACTIVE, GROUP_INACTIVE or OWNER_NOT_ELIGIBLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getTicket
      tags:
        - tickets
      summary: Ticket with properties, links and customer summary (ticket.view on the ticket's group)
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTicket
      tags:
        - tickets
      summary: Change title, state, priority, group, owner or tags (ticket.edit on the current group)
      description: >
        Only the fields sent are changed. A group change needs ticket.create on the destination,
        which must be active; from Ungrouped, ticket.edit on Ungrouped is enough (FR-041). ownerId
        must have edit on the (new) group (FR-040). pendingUntil is required to enter or remain in
        a pending state. State changes go through the ticket state machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                state:
                  $ref: "#/components/schemas/TicketState"
                pendingUntil:
                  type:
                    - string
                    - "null"
                  format: date-time
                priority:
                  $ref: "#/components/schemas/Priority"
                groupId:
                  type:
                    - string
                    - "null"
                  format: uuid
                ownerId:
                  type:
                    - string
                    - "null"
                  format: uuid
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: OWNER_NOT_ELIGIBLE, GROUP_INACTIVE or INVALID_TRANSITION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTicket
      tags:
        - tickets
      summary: Delete a ticket permanently (ticket.delete on its group)
      description: A hard delete; the customer's thread loses this ticket's messages. Writes a ticket.deleted audit entry.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{id}/triage:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: triageTicket
      tags:
        - tickets
      summary: Triage an ungrouped ticket in one step (ticket.edit on Ungrouped)
      description: >
        Sets the group, and optionally the owner, priority and tags, of an ungrouped ticket in one
        transaction (FR-063). The destination must be active; the owner must have edit on it
        (FR-040). A caller with edit on Ungrouped may send the ticket to any active group and keeps
        access only if their roles grant it there (FR-041). The ticket leaves the Ungrouped stream
        with ticket.removed_from_view (reason moved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
              additionalProperties: false
              properties:
                groupId:
                  type: string
                  format: uuid
                ownerId:
                  type: string
                  format: uuid
                priority:
                  $ref: "#/components/schemas/Priority"
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Triaged. visibleToCaller is false, and ticket absent, when the caller has no access to the new group.
          content:
            application/json:
              schema:
                type: object
                required:
                  - visibleToCaller
                properties:
                  visibleToCaller:
                    type: boolean
                  ticket:
                    $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ALREADY_TRIAGED (someone else triaged it first), GROUP_INACTIVE or OWNER_NOT_ELIGIBLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listTicketMessages
      tags:
        - tickets
      summary: Timeline — customer messages, public replies and internal notes (ticket.view on group)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: includeMerged
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Page of messages, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: postTicketMessage
      tags:
        - tickets
      summary: Send a public reply or add an internal note (ticket.edit on the ticket's group)
      description: A repeated clientMessageId returns the message already stored for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - visibility
                - body
                - clientMessageId
              additionalProperties: false
              properties:
                visibility:
                  type: string
                  enum:
                    - public
                    - internal
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                clientMessageId:
                  type: string
                  format: uuid
                attachmentIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
                mentionIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                  description: Internal notes only
      responses:
        "201":
          description: Created (or the existing message for a repeated clientMessageId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{id}/messages/{messageId}/move:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: moveTicketMessage
      tags:
        - tickets
      summary: Move a customer message to another of the same customer's tickets (ticket.move_message)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetTicketId
              additionalProperties: false
              properties:
                targetTicketId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DIFFERENT_CUSTOMER, SAME_TICKET or MESSAGE_NOT_MOVABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{id}/history:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: listTicketHistory
      tags:
        - tickets
      summary: Change history, newest first (ticket.view on the ticket's group)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: History entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/HistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{id}/links:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: createTicketLink
      tags:
        - tickets
      summary: Link to another ticket (ticket.edit on this ticket's group, ticket.view on the other)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetTicketId
                - kind
              additionalProperties: false
              properties:
                targetTicketId:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                    - follow_up_of
                    - related
                    - duplicate_of
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketLink"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SAME_TICKET or LINK_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{id}/links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: linkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteTicketLink
      tags:
        - tickets
      summary: Remove a link (ticket.edit on this ticket's group)
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /attachments:
    post:
      operationId: uploadAttachment
      tags:
        - tickets
      summary: Upload a file for a later message (25 MB max; allowed types only)
      description: Anyone who may reply somewhere may upload (ticket.edit); sending the message checks the ticket.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded; scanStatus pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentSummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "413":
          description: ATTACHMENT_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: ATTACHMENT_TYPE_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attachments/{id}/download:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: downloadAttachment
      tags:
        - tickets
      summary: Authorize, then redirect to a private URL valid for 15 minutes (ticket.view on group; notes included)
      responses:
        "302":
          description: Redirect to /api/v1/files/{token}, a signed link valid for 15 minutes
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ATTACHMENT_NOT_READY (still scanning) or ATTACHMENT_BLOCKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{token}:
    get:
      operationId: downloadFile
      tags:
        - tickets
      summary: Stream a file through a signed, 15-minute link issued by an attachment download endpoint
      description: No session needed; the token is checked for signature, expiry and that its tenant matches the host. Used by both the staff and customer download endpoints.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File contents (Content-Disposition attachment, inline only for safe images)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /tags:
    get:
      operationId: listTags
      tags:
        - tickets
      summary: Tenant tag list (tag.view)
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createTag
      tags:
        - tickets
      summary: Create a tag (tag.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          description: TAG_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateTag
      tags:
        - tickets
      summary: Rename a tag (tag.edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: TAG_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTag
      tags:
        - tickets
      summary: Delete a tag (tag.delete); removes it from tickets and customers
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getCustomer
      tags:
        - tickets
      summary: Customer profile (FR-069); ticket lists limited to the caller's access (user.view)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCustomer
      tags:
        - tickets
      summary: Edit contact details and tags (user.edit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                phone:
                  type: string
                  maxLength: 40
                company:
                  type: string
                  maxLength: 120
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Unknown customer, or an unknown tag id (TAG_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /views:
    get:
      operationId: listViews
      tags:
        - tickets
      summary: Views visible to the caller, in order, with live ticket counts (view.view)
      description: Needs Triage is additionally hidden from viewers without view access to Ungrouped (FR-077).
      responses:
        "200":
          description: Views
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /views/counts:
    get:
      operationId: getViewCounts
      tags:
        - tickets
      summary: Current ticket counts for the caller's views, by view id (view.view)
      description: Refetched when a views.counts_changed hint arrives on the views stream. Each count applies the viewer's
        access filter (FR-077) and is cached per viewer for 30 s (research D13).
      responses:
        "200":
          description: Counts by view id
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /views/order:
    put:
      operationId: reorderViews
      tags:
        - tickets
      summary: Reorder or hide views, all or nothing (FR-073)
      description: A personal view is its owner's to arrange; a shared view, default views included, needs view.edit, and the
        change applies to everyone it is shared with. An id the caller cannot see is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: Each id at most once
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - position
                      - hidden
                    properties:
                      id:
                        $ref: "#/components/schemas/Id"
                      position:
                        type: integer
                        minimum: 0
                        maximum: 10000
                      hidden:
                        type: boolean
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /views/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getView
      tags:
        - tickets
      summary: Get a view definition, with its live ticket count (view.view)
      responses:
        "200":
          description: View
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteView
      tags:
        - tickets
      summary: Delete a view (default views can be hidden, not deleted)
      description: A personal view is its owner's to delete; a shared view needs view.delete.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "SYSTEM_VIEW: default views can only be hidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: listNotifications
      tags:
        - operations
      summary: Own notification center, newest first (FR-078)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: unread
          in: query
          description: Only unread entries
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications and the unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required:
                      - items
                      - unreadCount
                    properties:
                      unreadCount:
                        type: integer
                        minimum: 0
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags:
        - operations
      summary: Mark notifications read (specific ids, or all); syncs to every session (FR-083)
      description: Ids that are not the caller's, or already read, are ignored. Sends notification.read on the user stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - ids
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: "#/components/schemas/Id"
                - type: object
                  additionalProperties: false
                  required:
                    - all
                  properties:
                    all:
                      type: boolean
                      const: true
      responses:
        "200":
          description: The new unread count
          content:
            application/json:
              schema:
                type: object
                required:
                  - unreadCount
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags:
        - operations
      summary: Own preferences, merged with the tenant defaults (FR-080)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: updateNotificationPreferences
      tags:
        - operations
      summary: Replace own preferences (FR-080)
      description: Events or channels left out fall back to the tenant defaults. Push and email toggles are stored now and
        delivered from US15.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: Saved, merged with the tenant defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rx_session
      description: Session cookie set on sign-in
    operatorSession:
      type: apiKey
      in: cookie
      name: rx_op_session
      description: Operator session cookie, set by platform sign-in on the console host
    supportToken:
      type: apiKey
      in: header
      name: X-Support-Token
      description: Read-only operator access to a tenant under an active support-access grant (FR-001a). Sent on the tenant
        host; every request is audited and anything but GET returns 403 READ_ONLY_SUPPORT_ACCESS.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's nextCursor
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key that makes a creating POST safe to retry (kept 24 h)
      schema:
        type: string
        maxLength: 100
  responses:
    ValidationFailed:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: Resource is visible but the action is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Missing, belongs to another tenant, or not visible to the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]+$
              examples:
                - TICKET_NOT_FOUND
            message:
              type: string
            details:
              type: array
              description: Only present for validation errors
              items:
                type: object
                required:
                  - path
                  - issue
                properties:
                  path:
                    type: string
                  issue:
                    type: string
            retryAfter:
              type: integer
              description: Seconds, only for RATE_LIMITED
    PageMeta:
      type: object
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - "null"
    TicketState:
      type: string
      enum:
        - new
        - open
        - pending_reminder
        - pending_close
        - resolved
        - closed
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    WaitingOn:
      type: string
      enum:
        - support
        - customer
    UserStatus:
      type: string
      enum:
        - invited
        - active
        - deactivated
    Availability:
      type: string
      enum:
        - online
        - away
        - offline
    UserRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
    GroupRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
    TagRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
    AttachmentSummary:
      type: object
      required:
        - id
        - fileName
        - contentType
        - sizeBytes
        - scanStatus
      properties:
        id:
          $ref: "#/components/schemas/Id"
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        scanStatus:
          type: string
          enum:
            - pending
            - clean
            - blocked
        downloadPath:
          type:
            - string
            - "null"
          description: API path that authorizes and redirects to a short-lived URL; null unless clean
    ConditionExpression:
      description: View / rule condition tree (see data-model.md "Condition expression")
      oneOf:
        - $ref: "#/components/schemas/ConditionGroup"
        - $ref: "#/components/schemas/Condition"
    ConditionGroup:
      type: object
      required:
        - op
        - items
      additionalProperties: false
      properties:
        op:
          type: string
          enum:
            - and
            - or
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConditionExpression"
    Condition:
      type: object
      required:
        - field
        - operator
        - value
      additionalProperties: false
      properties:
        field:
          type: string
          enum:
            - state
            - priority
            - group
            - owner
            - customer
            - tags
            - waiting_on
            - created_at
            - updated_at
            - last_customer_message_at
            - pending_until
            - sla_status
        operator:
          type: string
          enum:
            - is
            - is_not
            - contains
            - before
            - after
            - within_last
        value:
          description: >
            Shape depends on field/operator (validated server-side, not by this open schema): an id,
            enum value or array of either for `is`/`is_not`/`contains`; an ISO 8601 duration string
            for `within_last`; an ISO 8601 date-time, or the literal "now", for `before`/`after` on a
            date field (`created_at`, `updated_at`, `last_customer_message_at`, `pending_until`).
    Me:
      type: object
      required:
        - id
        - email
        - name
        - kind
        - roles
        - permissions
        - groupAccess
        - accessVersion
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - staff
            - customer
        availability:
          $ref: "#/components/schemas/Availability"
        roles:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
        permissions:
          type: array
          items:
            type: string
          examples:
            - - ticket.view
              - ticket.edit
        groupAccess:
          type: array
          description: Effective (union) access; groupId null = Ungrouped
          items:
            type: object
            required:
              - groupId
              - view
              - create
              - edit
              - delete
            properties:
              groupId:
                type:
                  - string
                  - "null"
                format: uuid
              view:
                type: boolean
              create:
                type: boolean
              edit:
                type: boolean
              delete:
                type: boolean
        accessVersion:
          type: integer
          description: Changes whenever access changes; clients refetch /me when it moves
    User:
      type: object
      required:
        - id
        - email
        - name
        - kind
        - status
        - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        kind:
          type: string
          enum:
            - staff
            - customer
        status:
          $ref: "#/components/schemas/UserStatus"
        locked:
          type: boolean
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        availability:
          $ref: "#/components/schemas/Availability"
        lastSignInAt:
          type:
            - string
            - "null"
