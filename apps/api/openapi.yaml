        editable:
          type: boolean
    NotificationEventType:
      type: string
      enum: &a1
        - ticket.ungrouped_created
        - ticket.arrived_in_group
        - message.customer_on_my_ticket
        - message.customer_on_unassigned
        - ticket.assigned_to_me
        - ticket.my_ticket_changed
        - mention
        - sla.warning
        - sla.breached
        - ticket.reminder_reached
      description: What a notification is about (FR-079)
    NotificationChannels:
      type: object
      additionalProperties: false
      required:
        - inApp
        - push
        - email
      properties:
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
      description: Whether the event is delivered in-app, by browser push and by email
    NotificationChannelsInput:
      type: object
      additionalProperties: false
      properties:
        inApp:
          type: boolean
        push:
          type: boolean
        email:
          type: boolean
      description: The channels to set; any left out follow the tenant default
    Notification:
      type: object
      required:
        - id
        - eventType
        - title
        - summary
        - ticketId
        - count
        - read
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Id"
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        title:
          type: string
        summary:
          type:
            - string
            - "null"
          description: Ticket title or a message excerpt
        ticketId:
          type:
            - string
            - "null"
          format: uuid
        count:
          type: integer
          minimum: 1
          description: Grouped burst size (FR-082)
        read:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    NotificationPreferences:
      type: object
      required:
        - enabled
        - events
      properties:
        enabled:
          type: boolean
          description: Master switch
        events:
          type: object
          description: Every event type, with each channel resolved
          required: *a1
          properties:
            ticket.ungrouped_created:
              $ref: "#/components/schemas/NotificationChannels"
            ticket.arrived_in_group:
              $ref: "#/components/schemas/NotificationChannels"
            message.customer_on_my_ticket:
              $ref: "#/components/schemas/NotificationChannels"
            message.customer_on_unassigned:
              $ref: "#/components/schemas/NotificationChannels"
            ticket.assigned_to_me:
              $ref: "#/components/schemas/NotificationChannels"
            ticket.my_ticket_changed:
              $ref: "#/components/schemas/NotificationChannels"
            mention:
              $ref: "#/components/schemas/NotificationChannels"
            sla.warning:
              $ref: "#/components/schemas/NotificationChannels"
            sla.breached:
              $ref: "#/components/schemas/NotificationChannels"
            ticket.reminder_reached:
              $ref: "#/components/schemas/NotificationChannels"
    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required:
        - enabled
        - events
      properties:
        enabled:
          type: boolean
          description: Master switch
        events:
          type: object
          additionalProperties: false
          description: Only the events and channels the user sets; the rest follow the tenant defaults
          properties:
            ticket.ungrouped_created:
              $ref: "#/components/schemas/NotificationChannelsInput"
            ticket.arrived_in_group:
              $ref: "#/components/schemas/NotificationChannelsInput"
            message.customer_on_my_ticket:
              $ref: "#/components/schemas/NotificationChannelsInput"
            message.customer_on_unassigned:
              $ref: "#/components/schemas/NotificationChannelsInput"
            ticket.assigned_to_me:
              $ref: "#/components/schemas/NotificationChannelsInput"
            ticket.my_ticket_changed:
              $ref: "#/components/schemas/NotificationChannelsInput"
            mention:
              $ref: "#/components/schemas/NotificationChannelsInput"
            sla.warning:
              $ref: "#/components/schemas/NotificationChannelsInput"
            sla.breached:
              $ref: "#/components/schemas/NotificationChannelsInput"
            ticket.reminder_reached:
              $ref: "#/components/schemas/NotificationChannelsInput"
