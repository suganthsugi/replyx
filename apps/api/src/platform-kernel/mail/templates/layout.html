<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:32px;font-size:16px;line-height:1.5;">
          {{{content}}}
        </td>
      </tr>
      <tr>
        <td style="padding:0 32px 32px;font-size:12px;color:#6e6e73;">Sent by {{workspaceName}}</td>
      </tr>
    </table>
  </body>
</html>
