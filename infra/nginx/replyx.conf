# infra/nginx/replyx.conf -- host nginx site for ReplyX (T201, adapted).
# replyx.example.com is a placeholder: replace every occurrence with your base domain.
#
# Install on the VM:
#   diff /etc/nginx/sites-available/replyx.example.com infra/nginx/replyx.conf
#   (if the live file has changes that are not in the repo, back it up first:
#    sudo cp /etc/nginx/sites-available/replyx.example.com /etc/nginx/sites-available/replyx.example.com.bak-$(date +%F))
#   sudo cp infra/nginx/replyx.conf /etc/nginx/sites-available/replyx.example.com
#   sudo ln -s /etc/nginx/sites-available/replyx.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (obtain the certificate first, see below; nginx -t fails while the certificate files are missing)
#
# Wildcard certificate (one certificate for the apex and every tenant/console host). Wildcards
# need the DNS-01 challenge, so certbot has to create a TXT record `_acme-challenge.replyx`:
#   sudo certbot certonly --manual --preferred-challenges dns \
#     -d replyx.example.com -d '*.replyx.example.com'
# or, if a certbot DNS plugin exists for your DNS provider, use it so renewal is
# automatic (a --manual certificate cannot renew unattended). Certificate name must stay
# `replyx.example.com` so the paths below match.
#
# Traffic flow:
#   replyx.example.com (apex)   -> this nginx (TLS) -> 127.0.0.1:8082 (docs container): the docs site.
#   *.replyx.example.com        -> this nginx (TLS) -> 127.0.0.1:8081 (Caddy container, plain HTTP) ->
#                                 SPA files, or api:3000 for /api/* and /rt/*. The api resolves the tenant from the Host header,
# so Host is passed through unchanged. Names in this file that must be unique across the whole
# nginx config (log_format, map variable, shared memory zone) carry a `replyx` prefix because
# other sites live in the same http{} context.

# Access log without the query string: signed file-download URLs carry their token there.
log_format replyx '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent '
                  '"$http_user_agent" host=$host rt=$request_time';

# Connection header for WebSocket upgrades, empty for plain keep-alive proxying.
map $http_upgrade $replyx_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name replyx.example.com *.replyx.example.com;

    return 301 https://$host$request_uri;
}

# The docs site on the apex host. Static files only: no uploads, no WebSockets, no health paths.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name replyx.example.com;

    ssl_certificate     /etc/letsencrypt/live/replyx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replyx.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:replyx_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/replyx.access.log replyx;
    error_log  /var/log/nginx/replyx.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';
        proxy_read_timeout 60s;
    }
}

# The app on every tenant host and the console host.
server {
    # nginx 1.24 (Ubuntu 24.04) takes http2 on the listen line; `http2 on;` needs 1.25.1+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.replyx.example.com;

    ssl_certificate     /etc/letsencrypt/live/replyx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replyx.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:replyx_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/replyx.access.log replyx;
    error_log  /var/log/nginx/replyx.error.log warn;

    # Attachments are limited to 25 MB by the api; leave room for multipart overhead.
    client_max_body_size 30m;

    # Liveness/readiness stay internal (the deploy script calls them on 127.0.0.1:8081).
    location ^~ /health/ {
        return 404;
    }

    # Socket.IO (long polling and WebSocket).
    location /rt/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $replyx_connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Overwrite, never append: this nginx is the edge, so a client-supplied
        # X-Forwarded-For must not survive (the api uses it for rate limiting).
        # If a CDN such as Cloudflare is put in front later, switch to the real-ip module.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';
        proxy_read_timeout 60s;
    }
}
