openapi: 3.1.0
info:
  title: ReplyX staff API — notifications, dashboard, audit, settings, support access, SLA, rules, webhooks
  version: 0.1.0
  description: Operations and configuration endpoints. Each admin section requires its registry permission (FR-071).
servers:
  - url: https://{tenant}.replyx.app/api/v1
    variables: { tenant: { default: acme } }
security:
  - session: []
paths:
  /notifications:
    get:
      summary: Own notification center, newest first (FR-078)
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Notifications and unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/PageMeta'
                  - type: object
                    required: [items, unreadCount]
                    properties:
                      unreadCount: { type: integer }
                      items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
  /notifications/read:
    post:
      summary: Mark notifications read (specific ids, or all); syncs to every session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        '200': { description: New unread count, content: { application/json: { schema: { type: object, properties: { unreadCount: { type: integer } } } } } }
  /notification-preferences:
    get:
      summary: Own preferences, merged with tenant defaults
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
    put:
      summary: Replace own preferences (FR-080)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
  /notification-preferences/push-subscriptions:
    post:
      summary: Register a browser push subscription (after the user grants permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys: { type: object, properties: { p256dh: { type: string }, auth: { type: string } } }
      responses:
        '204': { description: Registered }
  /dashboard:
    get:
      summary: Live operational numbers over the caller's accessible tickets (dashboard.view, FR-086)
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [counts, today, averages]
                properties:
                  counts:
                    type: object
                    properties:
                      open: { type: integer }
                      ungrouped: { type: integer }
                      unassigned: { type: integer }
                      waitingOnCustomer: { type: integer }
                      waitingOnSupport: { type: integer }
                      urgent: { type: integer }
                      slaBreached: { type: integer }
                  today:
                    type: object
                    properties:
                      created: { type: integer }
                      resolved: { type: integer }
                  averages:
                    type: object
                    properties:
                      firstResponseMinutes: { type: [number, 'null'] }
                      resolutionMinutes: { type: [number, 'null'] }
                      window: { type: string, examples: [P7D] }
                  satisfaction:
                    type: object
                    properties:
                      average: { type: [number, 'null'] }
                      responses: { type: integer }
  /audit-logs:
    get:
      summary: Append-only audit log (audit_log.view, FR-092)
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, examples: [ticket.assigned] } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, occurredAt, actor, action, resourceType]
                          properties:
                            id: { type: string, format: uuid }
                            occurredAt: { type: string, format: date-time }
                            actor:
                              type: object
                              properties:
                                kind: { type: string, enum: [user, operator, system, automation] }
                                id: { type: [string, 'null'] }
                                name: { type: string }
                            action: { type: string }
                            resourceType: { type: string }
                            resourceId: { type: [string, 'null'] }
                            details: { type: object }
                            ip: { type: [string, 'null'] }
  /settings:
    get:
      summary: Tenant settings (tenant_settings.view)
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/TenantSettings' } } } }
    patch:
      summary: Update tenant settings (tenant_settings.edit, FR-005, FR-005a)
      description: >
        Shortening retentionPeriod requires confirmPurgeCount equal to the number of tickets that
        will be deleted (from a 409 RETENTION_CONFIRMATION_REQUIRED response).
        brandColors.primary failing AA contrast returns 400 with a suggested color.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TenantSettings'
                - type: object
                  properties:
                    confirmPurgeCount: { type: integer }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TenantSettings' } } } }
        '400': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '409': { description: 'RETENTION_CONFIRMATION_REQUIRED (details include purge count)', content: { application/json: { schema: { $ref: 'common.yaml#/components/schemas/ErrorResponse' } } } }
  /support-access:
    get:
      summary: Support-access grants for this tenant (support_access.view)
      responses:
        '200':
          description: Grants, active first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SupportAccessGrant' } }
    post:
      summary: Grant platform operators temporary read-only access (support_access.create, FR-001a)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationHours]
              properties:
                durationHours: { type: integer, minimum: 1, maximum: 168 }
                reason: { type: string, maxLength: 500 }
      responses:
        '201': { description: Granted, content: { application/json: { schema: { $ref: '#/components/schemas/SupportAccessGrant' } } } }
  /support-access/{id}/revoke:
    post:
      summary: Revoke a grant immediately (support_access.delete)
      parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/SupportAccessGrant' } } } }
  /business-hours:
    get:
      summary: Business-hours calendars (sla_policy.view)
      responses:
        '200': { description: Calendars, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BusinessHours' } } } } } } }
    post:
      summary: Create a calendar (sla_policy.create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessHours' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessHours' } } } }
  /business-hours/{id}:
    parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
    put:
      summary: Replace (sla_policy.edit); SLA due times are recomputed for open tickets
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessHours' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessHours' } } } }
    delete:
      summary: Delete (sla_policy.delete); refused while a policy uses it
      responses:
        '204': { description: Deleted }
        '409': { description: IN_USE, content: { application/json: { schema: { $ref: 'common.yaml#/components/schemas/ErrorResponse' } } } }
  /sla-policies:
    get:
      summary: Ordered SLA policies (sla_policy.view)
      responses:
        '200': { description: Policies, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SlaPolicy' } } } } } } }
    post:
      summary: Create (sla_policy.create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
  /sla-policies/{id}:
    parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
    put:
      summary: Replace (sla_policy.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
    delete:
      summary: Delete (sla_policy.delete)
      responses:
        '204': { description: Deleted }
  /routing-rules:
    get:
      summary: Ordered routing rules (routing_rule.view)
      responses:
        '200': { description: Rules, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RoutingRule' } } } } } } }
    post:
      summary: Create (routing_rule.create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } } }
  /routing-rules/order:
    put:
      summary: Reorder rules (routing_rule.edit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string, format: uuid } } } }
      responses:
        '204': { description: Saved }
  /routing-rules/{id}:
    parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
    put:
      summary: Replace (routing_rule.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } } }
    delete:
      summary: Delete (routing_rule.delete)
      responses:
        '204': { description: Deleted }
  /routing-rules/test:
    post:
      summary: Dry-run the rules against a sample first message and customer (routing_rule.view)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 10000 }
                customerId: { type: string, format: uuid }
      responses:
        '200': { description: 'Matched rule (or none)', content: { application/json: { schema: { type: object, properties: { matchedRuleId: { type: [string, 'null'] }, actions: { type: object } } } } } }
  /automation-rules:
    get:
      summary: Automation rules (automation_rule.view, P3)
      responses:
        '200': { description: Rules, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AutomationRule' } } } } } } }
    post:
      summary: Create (automation_rule.create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRule' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRule' } } } }
  /automation-rules/{id}:
    parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
    put:
      summary: Replace (automation_rule.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRule' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRule' } } } }
    delete:
      summary: Delete (automation_rule.delete)
      responses:
        '204': { description: Deleted }
  /webhooks:
    get:
      summary: Webhook endpoints (webhook.view, P3)
      responses:
        '200': { description: Endpoints, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Webhook' } } } } } } }
    post:
      summary: Create (webhook.create); the signing secret is returned once
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookInput' } } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Webhook'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, description: Shown only in this response }
        '400': { description: 'VALIDATION_FAILED (non-HTTPS or disallowed host)', content: { application/json: { schema: { $ref: 'common.yaml#/components/schemas/ErrorResponse' } } } }
  /webhooks/{id}:
    parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
    put:
      summary: Replace URL, events or enabled flag (webhook.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
    delete:
      summary: Delete (webhook.delete)
      responses:
        '204': { description: Deleted }
  /webhooks/{id}/rotate-secret:
    post:
      summary: Rotate the signing secret (webhook.edit)
      parameters: [ { $ref: 'common.yaml#/components/parameters/IdPath' } ]
      responses:
        '200': { description: 'New secret (shown once)', content: { application/json: { schema: { type: object, required: [secret], properties: { secret: { type: string } } } } } }
  /webhooks/{id}/deliveries:
    get:
      summary: Delivery history, last 30 days (webhook.view)
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdPath'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            eventId: { type: string }
                            eventType: { type: string }
                            attempt: { type: integer }
                            status: { type: string, enum: [pending, succeeded, failed, gave_up] }
                            responseCode: { type: [integer, 'null'] }
                            durationMs: { type: [integer, 'null'] }
                            error: { type: [string, 'null'] }
                            createdAt: { type: string, format: date-time }
                            nextAttemptAt: { type: [string, 'null'], format: date-time }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: rx_session }
  schemas:
    Notification:
      type: object
      required: [id, eventType, title, createdAt, read, count]
      properties:
        id: { type: string, format: uuid }
        eventType:
          type: string
          enum: [ticket.ungrouped_created, ticket.arrived_in_group, message.customer_on_my_ticket, message.customer_on_unassigned, ticket.assigned_to_me, ticket.my_ticket_changed, mention, sla.warning, sla.breached, ticket.reminder_reached]
        title: { type: string }
        summary: { type: string }
        ticketId: { type: [string, 'null'], format: uuid }
        count: { type: integer, description: Grouped burst size }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      required: [enabled, events]
      properties:
        enabled: { type: boolean, description: Master switch }
        events:
          type: object
          additionalProperties:
            type: object
            properties:
              inApp: { type: boolean }
              push: { type: boolean }
              email: { type: boolean }
    TenantSettings:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        logoAttachmentId: { type: [string, 'null'], format: uuid }
        brandColors: { type: object, properties: { primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }, accent: { type: string, pattern: '^#[0-9a-fA-F]{6}$' } } }
        welcomeMessage: { type: [string, 'null'], maxLength: 500 }
        timezone: { type: string }
        selfRegistration: { type: boolean }
        gracePeriodHours: { type: integer, minimum: 1, maximum: 720 }
        afterCloseBehavior: { type: string, enum: [new_follow_up, reopen_previous] }
        offlineCustomerNotification: { type: string, enum: [email, off] }
        outOfHoursMessage: { type: [string, 'null'], maxLength: 500 }
        businessHoursId: { type: [string, 'null'], format: uuid }
        retentionPeriod: { type: string, enum: [forever, P1Y, P2Y, P3Y, P4Y, P5Y, P6Y, P7Y] }
        auditRetention: { type: string, enum: [forever, P1Y, P2Y, P3Y, P5Y, P7Y, P10Y] }
        notificationDefaults: { $ref: '#/components/schemas/NotificationPreferences' }
    SupportAccessGrant:
      type: object
      required: [id, grantedBy, startsAt, expiresAt, active]
      properties:
        id: { type: string, format: uuid }
        grantedBy: { $ref: 'common.yaml#/components/schemas/UserRef' }
        reason: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        active: { type: boolean }
    BusinessHours:
      type: object
      required: [name, timezone, intervals]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 80 }
        timezone: { type: string }
        intervals:
          type: object
          description: Weekday (mon..sun) to list of HH:MM ranges
          additionalProperties:
            type: array
            items: { type: object, required: [from, to], properties: { from: { type: string, pattern: '^\d{2}:\d{2}$' }, to: { type: string, pattern: '^\d{2}:\d{2}$' } } }
        holidays: { type: array, items: { type: string, format: date } }
    SlaPolicy:
      type: object
      required: [name, conditions, businessHoursId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 80 }
        position: { type: integer }
        conditions: { $ref: 'common.yaml#/components/schemas/ConditionGroup' }
        businessHoursId: { type: string, format: uuid }
        firstResponseMinutes: { type: [integer, 'null'], minimum: 1 }
        nextResponseMinutes: { type: [integer, 'null'], minimum: 1 }
        resolutionMinutes: { type: [integer, 'null'], minimum: 1 }
        warningPercent: { type: integer, minimum: 50, maximum: 99, default: 80 }
    RoutingRule:
      type: object
      required: [name, enabled, conditions, actions]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 80 }
        position: { type: integer, readOnly: true }
        enabled: { type: boolean }
        conditions:
          type: object
          description: All present parts must match
          properties:
            messageContainsAny: { type: array, items: { type: string, maxLength: 100 } }
            messageContainsAll: { type: array, items: { type: string, maxLength: 100 } }
            customerTagIds: { type: array, items: { type: string, format: uuid } }
            emailDomains: { type: array, items: { type: string } }
        actions:
          type: object
          required: [groupId]
          properties:
            groupId: { type: string, format: uuid }
            priority: { $ref: 'common.yaml#/components/schemas/Priority' }
            tagIds: { type: array, items: { type: string, format: uuid } }
    AutomationRule:
      type: object
      required: [name, enabled, trigger, conditions, actions]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        trigger:
          type: object
          required: [event]
          properties:
            event: { type: string, enum: [ticket.created, ticket.updated, message.created, time.elapsed] }
            after: { type: string, description: ISO duration for time.elapsed, examples: [P2D] }
            since: { type: string, enum: [created_at, updated_at, last_customer_message_at, last_agent_reply_at] }
        conditions: { $ref: 'common.yaml#/components/schemas/ConditionGroup' }
        actions:
          type: object
          properties:
            groupId: { type: string, format: uuid }
            ownerId: { type: [string, 'null'], format: uuid }
            priority: { $ref: 'common.yaml#/components/schemas/Priority' }
            state: { $ref: 'common.yaml#/components/schemas/TicketState' }
            addTagIds: { type: array, items: { type: string, format: uuid } }
            autoReply: { type: string, maxLength: 10000 }
            notifyUserIds: { type: array, items: { type: string, format: uuid } }
    WebhookInput:
      type: object
      required: [url, events, enabled]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        events: { type: array, minItems: 1, items: { type: string, enum: [ticket.created, ticket.updated, message.created, ticket.assigned, ticket.closed] } }
        enabled: { type: boolean }
    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            lastDeliveryStatus: { type: [string, 'null'] }
